<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>index.html</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F6F5F0;
    --surface: #FFFFFF;
    --ink: #1E2B26;
    --ink-soft: #55635C;
    --ink-faint: #93A099;
    --line: #DAD9D0;
    --line-strong: #B9C2BB;
    --accent: #2B6E5F;
    --accent-soft: #E4EFEA;
    --accent-deep: #17453B;
    --amber: #B8863C;
    --amber-soft: #F5EDDC;
    --radius: 10px;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'Inter', -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  html[data-theme="dark"]{
    --bg: #121815;
    --surface: #182420;
    --ink: #E9EFEA;
    --ink-soft: #A9B6AF;
    --ink-faint: #6C7A72;
    --line: #2A3833;
    --line-strong: #3C4C45;
    --accent: #5BAF98;
    --accent-soft: #1E3730;
    --accent-deep: #8FD4BC;
    --amber: #D6A968;
    --amber-soft: #33291A;
  }
  html{ background:var(--bg); transition:background 0.2s; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.6; -webkit-font-smoothing:antialiased; transition:background 0.2s, color 0.2s; }
  .app{ max-width:1040px; margin:0 auto; min-height:100vh; background:var(--surface); border-left:1px solid var(--line); border-right:1px solid var(--line); }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:20px 32px; border-bottom:1px solid var(--line); }
  .brand{ display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:19px; font-weight:600; letter-spacing:0.01em; }
  .brand .mark{ width:28px; height:28px; border:1.5px solid var(--ink); border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:12px; font-weight:500; }
  .topbar-right{ display:flex; align-items:center; gap:18px; }
  .tabs{ display:flex; gap:4px; }
  .tab{ font-family:var(--sans); font-size:14px; font-weight:500; color:var(--ink-soft); padding:8px 16px; border-radius:20px; cursor:pointer; border:none; background:transparent; transition:background 0.15s, color 0.15s; }
  .tab:hover{ background:var(--accent-soft); color:var(--accent-deep); }
  .tab.active{ background:var(--accent); color:#fff; }
  .lang-switch{ display:flex; border:1px solid var(--line-strong); border-radius:16px; overflow:hidden; font-family:var(--mono); font-size:11px; }
  .lang-btn{ padding:5px 11px; border:none; background:var(--surface); color:var(--ink-soft); cursor:pointer; }
  .lang-btn.active{ background:var(--ink); color:var(--bg); }
  .theme-btn{ width:28px; height:28px; border-radius:50%; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .theme-btn:hover{ border-color:var(--accent); color:var(--accent-deep); }

  .screen{ display:none; }
  .screen.active{ display:block; animation:fade 0.25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  .eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:0.08em; color:var(--ink-faint); text-transform:uppercase; margin-bottom:10px; }

  /* HOME */
  .hero{ padding:72px 32px 48px; text-align:center; border-bottom:1px solid var(--line); }
  .hero .glyph{ width:56px; height:56px; margin:0 auto 24px; border:1.5px solid var(--ink); border-radius:12px; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:13px; }
  .hero h1{ font-family:var(--serif); font-size:34px; font-weight:600; max-width:540px; margin:0 auto 16px; line-height:1.3; }
  .hero p{ color:var(--ink-soft); max-width:460px; margin:0 auto; font-size:15px; }
  .cta-row{ display:grid; grid-template-columns:repeat(3, 1fr); gap:1px; background:var(--line); border-top:1px solid var(--line); }
  .cta-card{ background:var(--surface); padding:32px 28px; cursor:pointer; transition:background 0.15s; }
  .cta-card:hover{ background:var(--accent-soft); }
  .cta-card .num{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); margin-bottom:14px; }
  .cta-card h3{ font-family:var(--serif); font-size:19px; font-weight:600; margin-bottom:8px; }
  .cta-card p{ font-size:13px; color:var(--ink-soft); margin-bottom:16px; }
  .cta-card .go{ font-family:var(--mono); font-size:12px; color:var(--accent-deep); }

  .section-pad{ padding:32px; }

  /* ===== TRY — workspace-style layout, matching SketchAssist ===== */
  .work-shell{ display:flex; flex-direction:column; height:640px; }
  .work-top{ display:flex; align-items:center; justify-content:space-between; padding:12px 20px; border-bottom:1px solid var(--line); }
  .work-top-left{ display:flex; align-items:center; gap:12px; }
  .icon-btn{ width:32px; height:32px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .icon-btn:hover{ background:var(--accent-soft); }
  .work-title{ display:flex; align-items:center; gap:8px; font-family:var(--serif); font-size:16px; font-weight:600; }
  .work-tag{ font-family:var(--mono); font-size:10px; letter-spacing:0.05em; color:var(--accent-deep); background:var(--accent-soft); padding:2px 8px; border-radius:4px; }
  .work-top-right{ display:flex; gap:8px; }
  .export-btn{ font-family:var(--sans); font-size:12px; padding:6px 12px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); display:flex; align-items:center; gap:6px; cursor:pointer; }
  .export-btn:hover{ background:var(--accent-soft); border-color:var(--accent); }

  .work-body{ flex:1; display:flex; min-height:0; }
  .work-app-sidebar{ width:52px; border-right:1px solid var(--line); background:var(--surface); display:flex; flex-direction:column; justify-content:space-between; align-items:center; padding:14px 0; flex-shrink:0; }
  .was-top{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .was-bottom{ display:flex; flex-direction:column; align-items:center; gap:16px; }
  .was-icon{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--ink-faint); font-family:var(--mono); }
  .was-icon.active{ background:var(--accent-soft); color:var(--accent-deep); }
  .was-icon.status{ color:#3FB56C; font-size:15px; }
  .work-left-tools{ width:56px; border-right:1px solid var(--line); padding:16px 0; display:flex; flex-direction:column; align-items:center; gap:18px; }
  .work-left-tools .t{ font-size:16px; color:var(--ink-soft); display:flex; flex-direction:column; align-items:center; gap:2px; }
  .work-left-tools .t span{ font-family:var(--mono); font-size:8px; }

  .work-main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .stage-tabstrip{ display:flex; gap:2px; padding:14px 20px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .stage-tab{ font-family:var(--sans); font-size:12.5px; color:var(--ink-soft); padding:8px 12px; border:none; background:transparent; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
  .stage-tab.active{ color:var(--ink); border-bottom-color:var(--accent); font-weight:500; }
  .stage-tab .n{ font-family:var(--mono); font-size:10px; color:var(--ink-faint); margin-right:4px; }

  .viewer{ flex:1; position:relative; display:flex; align-items:center; justify-content:center; background:var(--bg); overflow:hidden; min-height:260px; }
  .viewer .stage-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:var(--bg); }
  .viewer .glyph-big{ position:relative; font-size:56px; color:rgba(30,43,38,0.4); display:none; }
  .viewer .badge{ position:absolute; top:10px; left:10px; font-family:var(--mono); font-size:10px; color:rgba(0,0,0,0.5); background:rgba(255,255,255,0.75); padding:3px 8px; border-radius:4px; z-index:2; }
  .viewer .label{ position:absolute; bottom:10px; font-family:var(--mono); font-size:11px; color:rgba(0,0,0,0.55); background:rgba(255,255,255,0.75); padding:4px 10px; border-radius:4px; z-index:2; }

  .work-nav{ display:flex; justify-content:center; gap:10px; padding:12px 0; border-top:1px solid var(--line); }
  .btn{ font-family:var(--sans); font-size:13px; font-weight:500; padding:9px 18px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); cursor:pointer; }
  .btn:hover{ background:var(--accent-soft); border-color:var(--accent); }
  .btn.primary{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .btn.primary:hover{ opacity:0.88; }

  .work-right{ width:270px; border-left:1px solid var(--line); overflow-y:auto; padding:16px; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .panel-head h4{ font-family:var(--serif); font-size:14px; font-weight:600; }
  .engine-tag{ font-family:var(--mono); font-size:9px; color:var(--accent-deep); }
  .mode-label{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-bottom:8px; }
  .mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:18px; }
  .mode-chip{ font-family:var(--sans); font-size:12px; padding:8px 6px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft); cursor:pointer; text-align:center; }
  .mode-chip.active{ background:var(--accent); color:#fff; border-color:var(--accent); font-weight:500; }
  .mode-chip.soon{ grid-column:span 2; opacity:0.45; cursor:not-allowed; border-style:dashed; }

  .stage-card{ border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px; cursor:pointer; display:flex; gap:10px; align-items:flex-start; }
  .stage-card:hover{ border-color:var(--accent); }
  .stage-card.active{ border-color:var(--accent); background:var(--accent-soft); }
  .stage-card .sc-num{ width:20px; height:20px; border-radius:50%; background:var(--bg); border:1px solid var(--line-strong); font-family:var(--mono); font-size:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .stage-card.done .sc-num{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .stage-card .sc-body{ flex:1; min-width:0; }
  .stage-card .sc-title{ font-size:12.5px; font-weight:500; margin-bottom:2px; }
  .stage-card .sc-desc{ font-size:11px; color:var(--ink-soft); line-height:1.4; }
  .stage-card .sc-thumb{ width:36px; height:36px; border-radius:6px; overflow:hidden; flex-shrink:0; background:var(--bg); position:relative; }
  .stage-card .sc-thumb img{ width:100%; height:100%; object-fit:cover; }

  .own-photo-banner{ margin:16px 20px; border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; background:var(--accent-soft); display:none; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .own-photo-banner.show{ display:flex; animation:fade 0.3s ease; }
  .own-photo-banner .txt h4{ font-family:var(--serif); font-size:15px; font-weight:600; margin-bottom:4px; color:var(--accent-deep); }
  .own-photo-banner .txt p{ font-size:12.5px; color:var(--ink-soft); }

  /* LEARN */
  .learn-layout{ display:grid; grid-template-columns:230px 1fr; min-height:480px; }
  .toc{ border-right:1px solid var(--line); padding:24px 8px; }
  .toc-item{ font-size:13.5px; padding:8px 16px; border-radius:6px; cursor:pointer; color:var(--ink-soft); }
  .toc-item.active{ background:var(--accent-soft); color:var(--accent-deep); font-weight:500; }
  .toc-item:hover:not(.active){ background:var(--bg); }
  .toc-sub{ padding-left:30px; font-size:12.5px; font-family:var(--mono); }
  .learn-content{ padding:36px 40px; }
  .learn-content h2{ font-family:var(--serif); font-size:23px; font-weight:600; margin-bottom:14px; }
  .try-link{ display:inline-block; font-family:var(--mono); font-size:11px; color:var(--accent-deep); background:var(--accent-soft); padding:4px 10px; border-radius:12px; margin-bottom:16px; cursor:pointer; }
  .placeholder-line{ height:11px; background:var(--bg); border-radius:4px; margin-bottom:9px; }
  .detail-box{ margin-top:20px; border:1px dashed var(--line-strong); border-radius:8px; padding:14px 16px; font-family:var(--mono); font-size:12px; color:var(--ink-faint); cursor:pointer; }
  .detail-box.open{ color:var(--ink-soft); border-style:solid; }

  /* DOWNLOAD */
  .dl-center{ text-align:center; padding:64px 32px; }
  .version-tag{ display:inline-block; font-family:var(--mono); font-size:12px; color:var(--accent-deep); background:var(--accent-soft); padding:5px 12px; border-radius:14px; margin-bottom:28px; }
  .os-row{ display:flex; justify-content:center; gap:8px; margin-bottom:28px; }
  .os-btn{ font-size:13px; font-weight:500; padding:9px 20px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft); cursor:pointer; }
  .os-btn.active{ border-color:var(--ink); color:var(--ink); background:var(--accent-soft); }
  .dl-btn{ font-family:var(--sans); font-size:15px; font-weight:600; padding:14px 40px; border-radius:10px; border:none; background:var(--ink); color:var(--bg); cursor:pointer; }
  .dl-btn:hover{ background:var(--accent-deep); }
  .dl-note{ margin-top:12px; font-size:12px; color:var(--ink-faint); font-family:var(--mono); min-height:16px; }
  .guide-link{ margin-top:24px; font-size:13px; color:var(--accent-deep); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
  .guide-box{ max-width:420px; margin:20px auto 0; text-align:left; border:1px solid var(--line); border-radius:8px; padding:16px 18px; font-size:13px; color:var(--ink-soft); display:none; }
  .guide-box.open{ display:block; }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand"><span class="mark">S</span>App B</div>
    <div class="topbar-right">
      <div class="tabs" id="tabs">
        <button class="tab active" data-screen="home"></button>
        <button class="tab" data-screen="try"></button>
        <button class="tab" data-screen="learn"></button>
        <button class="tab" data-screen="download"></button>
      </div>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ja">JA</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <button class="theme-btn" id="theme-btn" title="Toggle light / dark">◐</button>
    </div>
  </div>

  <!-- HOME -->
  <section class="screen active" id="screen-home">
    <div class="hero">
      <div class="glyph">S</div>
      <h1 id="home-title"></h1>
      <p id="home-desc"></p>
    </div>
    <div class="cta-row">
      <div class="cta-card" onclick="goTo('try')">
        <div class="num">01</div><h3 id="cta1-title"></h3><p id="cta1-desc"></p><div class="go" id="cta1-go"></div>
      </div>
      <div class="cta-card" onclick="goTo('learn')">
        <div class="num">02</div><h3 id="cta2-title"></h3><p id="cta2-desc"></p><div class="go" id="cta2-go"></div>
      </div>
      <div class="cta-card" onclick="goTo('download')">
        <div class="num">03</div><h3 id="cta3-title"></h3><p id="cta3-desc"></p><div class="go" id="cta3-go"></div>
      </div>
    </div>
  </section>

  <!-- TRY — workspace replica -->
  <section class="screen" id="screen-try">
    <div class="work-shell">
      <div class="work-top">
        <div class="work-top-left">
          <button class="icon-btn" onclick="goTo('home')">←</button>
          <div class="work-title">
            <span id="work-mode-name"></span>
            <span class="work-tag" id="work-tag">SAMPLE</span>
          </div>
        </div>
        <div class="work-top-right">
          <button class="icon-btn">📂</button>
          <button class="icon-btn">📷</button>
          <button class="icon-btn">🗑</button>
          <button class="export-btn" id="export-btn"></button>
        </div>
      </div>

      <div class="work-body">
        <div class="work-app-sidebar">
          <div class="was-top">
            <div class="was-icon">S</div>
            <div class="was-icon active">🖼</div>
          </div>
          <div class="was-bottom">
            <div class="was-icon status">🛡</div>
            <div class="was-icon">◐</div>
            <div class="was-icon">⧉</div>
          </div>
        </div>
        <div class="work-left-tools">
          <div class="t">▲<span>SEL</span></div>
          <div class="t">✎<span>PEN</span></div>
          <div class="t">⌫<span>ERS</span></div>
          <div class="t">T<span>TXT</span></div>
          <div class="t">⤢<span>SCL</span></div>
        </div>

        <div class="work-main">
          <div class="stage-tabstrip" id="stage-tabstrip"></div>

          <div class="viewer" id="stage-display">
            <img class="stage-img" id="stage-img" alt="">
            <div class="glyph-big" id="stage-glyph"></div>
            <div class="badge" id="stage-badge"></div>
            <div class="label" id="stage-label"></div>
          </div>

          <div class="work-nav">
            <button class="btn" id="btn-prev"></button>
            <button class="btn primary" id="btn-next"></button>
          </div>

          <div class="own-photo-banner" id="own-photo-banner">
            <div class="txt"><h4 id="banner-title"></h4><p id="banner-desc"></p></div>
            <button class="btn primary" onclick="goTo('download')" id="banner-btn"></button>
          </div>
        </div>

        <div class="work-right">
          <div class="panel-head"><h4 id="panel-head-title"></h4><span class="engine-tag" id="engine-tag"></span></div>
          <div class="mode-label" id="mode-label"></div>
          <div class="mode-grid" id="mode-grid"></div>
          <div id="stage-cards"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- LEARN -->
  <section class="screen" id="screen-learn">
    <div class="learn-layout">
      <div class="toc" id="toc"></div>
      <div class="learn-content" id="learn-content"></div>
    </div>
  </section>

  <!-- DOWNLOAD -->
  <section class="screen" id="screen-download">
    <div class="dl-center">
      <div class="version-tag" id="dl-version"></div>
      <div class="os-row" id="os-row"></div>
      <button class="dl-btn" id="dl-btn"></button>
      <div class="dl-note" id="dl-note"></div>
      <div class="guide-link" id="guide-link" onclick="toggleGuide()"></div>
      <div class="guide-box" id="guide-box">
        <div class="placeholder-line" style="width:70%"></div>
        <div class="placeholder-line" style="width:90%"></div>
        <div class="placeholder-line" style="width:55%"></div>
      </div>
    </div>
  </section>

</div>

<script>
/* =========================================================
   STR — 全UI文字列（コードから分離、ja / en 切替）
   ========================================================= */
const STR = {
  ja: {
    nav: { home:'Home', try:'Try', learn:'Learn', download:'Download' },
    home: {
      title:'SketchAssist — 画像を段階的に処理するツール',
      desc:'誰でもすぐに仕組みを試せます。難しい設定は必要ありません。',
      cta1_title:'Try SketchAssist', cta1_desc:'サンプルでその場で体験する', cta1_go:'はじめる →',
      cta2_title:'Learn', cta2_desc:'SketchAssistの考え方と使い方を理解する', cta2_go:'読む →',
      cta3_title:'Download', cta3_desc:'SketchAssistを入手して使い始める', cta3_go:'入手する →'
    },
    try: {
      tag:'サンプル', export:'エクスポート',
      panel_title:'処理ステージ', engine:'エンジン接続済み', mode_label:'処理モード',
      prev:'← Previous', next:'Next →',
      run:'実行', rerun:'再実行',
      banner_title:'自分の写真で試してみたくなったら',
      banner_desc:'Web版はサンプルのみの体験です。ご自身の画像を処理するにはSketchAssistをダウンロードしてください。',
      banner_btn:'Download SketchAssist',
      result_note:'SketchAssistで事前に生成された結果を表示（仮）',
      modes:[
        { name:'昆虫モード' },
        { name:'植物モード' },
        { name:'化石モード' },
        { name:'考古遺物モード' }
      ],
      mode_soon_name:'汎用モード（試作中・近日公開）',
      stages:[
        { name:'元の写真', desc:'アップロード済みの原本画像' },
        { name:'投げ縄選択', desc:'対象物を投げ縄で囲んで選択範囲を指定する' },
        { name:'特徴線強調', desc:'陰影・テクスチャを除去し特徴線を強調する' },
        { name:'エッジ抽出', desc:'特徴線強調画像から構造エッジを抽出する' },
        { name:'手書き修正', desc:'部位マップを参照しながらペン・消しゴムで手書き修正する' }
      ]
    },
    learn: {

/* =========================================================
   画像/サンプルデータ（言語非依存）。
   assets/samples/{mode}/{sample}/{stage}.jpg に画像を置くと自動反映。
   ========================================================= */
const MODE_KEYS = ['insect','plant','fossil','artifact'];
const STAGE_KEYS = ['original','lasso','feature','edge','handfix'];
const TOPTAB_STAGE_COUNT = 4; // 元写真〜エッジ抽出はタブ、手書き修正はカードの実行で進む
const SAMPLE_GLYPH = '●';
const OS_LIST = [
  { key:'Windows', ext:'exe' },
  { key:'macOS', ext:'dmg' },
  { key:'Linux', ext:'AppImage' }
];

function imagePath(modeIdx, stageIdx){
  return 'assets/samples/' + MODE_KEYS[modeIdx] + '/sample1/' + STAGE_KEYS[stageIdx] + '.jpg';
}

/* 仮の暫定画像：本物の写真が各パスに用意されるまで、
   すべてのモード・ステージでこの1枚を代わりに表示する。
   画像は images-data.js のような専用ファイルではなく、
   assets/samples/ 配下に置いた実ファイルをそのまま参照する。
   該当パスに本物の画像が置かれれば、そちらが自動的に優先される。 */
const TEMP_IMAGE = 'assets/samples/insect/sample1/original.jpg';


let lang = 'ja';
let curMode = 0, curStage = 0, curOs = 0, curTopic = 'intro';

function t(){ return STR[lang]; }

/* ---------- top nav / lang / theme ---------- */
function goTo(name){
  document.querySelectorAll('.tab').forEach(tb => tb.classList.toggle('active', tb.dataset.screen === name));
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + name));
}
document.querySelectorAll('.tab').forEach(tb => tb.addEventListener('click', () => goTo(tb.dataset.screen)));
document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  document.querySelectorAll('.lang-btn').forEach(x => x.classList.toggle('active', x.dataset.lang === lang));
  renderAll();
}));
document.getElementById('theme-btn').addEventListener('click', () => {
  const root = document.documentElement;
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  if(next === 'dark'){ root.setAttribute('data-theme','dark'); } else { root.removeAttribute('data-theme'); }
  document.getElementById('theme-btn').textContent = next === 'dark' ? '◑' : '◐';
});

/* ---------- static text ---------- */
function renderStaticText(){
  const s = t();
  document.getElementById('tabs').children[0].textContent = s.nav.home;
  document.getElementById('tabs').children[1].textContent = s.nav.try;
  document.getElementById('tabs').children[2].textContent = s.nav.learn;
  document.getElementById('tabs').children[3].textContent = s.nav.download;

  document.getElementById('home-title').textContent = s.home.title;
  document.getElementById('home-desc').textContent = s.home.desc;
  document.getElementById('cta1-title').textContent = s.home.cta1_title;
  document.getElementById('cta1-desc').textContent = s.home.cta1_desc;
  document.getElementById('cta1-go').textContent = s.home.cta1_go;
  document.getElementById('cta2-title').textContent = s.home.cta2_title;
  document.getElementById('cta2-desc').textContent = s.home.cta2_desc;
  document.getElementById('cta2-go').textContent = s.home.cta2_go;
  document.getElementById('cta3-title').textContent = s.home.cta3_title;
  document.getElementById('cta3-desc').textContent = s.home.cta3_desc;
  document.getElementById('cta3-go').textContent = s.home.cta3_go;

  document.getElementById('work-tag').textContent = s.try.tag;
  document.getElementById('export-btn').textContent = '⭳ ' + s.try.export;
  document.getElementById('btn-prev').textContent = s.try.prev;
  document.getElementById('btn-next').textContent = s.try.next;
  document.getElementById('banner-title').textContent = s.try.banner_title;
  document.getElementById('banner-desc').textContent = s.try.banner_desc;
  document.getElementById('banner-btn').textContent = s.try.banner_btn;
  document.getElementById('panel-head-title').textContent = s.try.panel_title;
  document.getElementById('engine-tag').textContent = s.try.engine;
  document.getElementById('mode-label').textContent = s.try.mode_label;

  document.getElementById('dl-version').textContent = s.download.version;
  document.getElementById('dl-btn').textContent = s.download.dl;
  document.getElementById('guide-link').textContent = s.download.guide;
}

/* ---------- TRY ---------- */
function renderModeGrid(){
  const el = document.getElementById('mode-grid');
  el.innerHTML = '';
  t().try.modes.forEach((m,i) => {
    const b = document.createElement('button');
    b.className = 'mode-chip' + (i===curMode ? ' active':'');
    b.textContent = m.name;
    b.onclick = () => { curMode = i; curStage = 0; renderTry(); };
    el.appendChild(b);
  });
  const soon = document.createElement('button');
  soon.className = 'mode-chip soon';
  soon.textContent = t().try.mode_soon_name;
  soon.disabled = true;
  el.appendChild(soon);
}

function renderStageTabstrip(){
  const el = document.getElementById('stage-tabstrip');
  el.innerHTML = '';
  t().try.stages.slice(0, TOPTAB_STAGE_COUNT).forEach((st,i) => {
    const b = document.createElement('button');
    b.className = 'stage-tab' + (i===curStage ? ' active':'');
    b.innerHTML = (i>0 ? '<span class="n">'+i+'</span>' : '') + st.name;
    b.onclick = () => { curStage = i; renderTry(); };
    el.appendChild(b);
  });
}

function renderStageCards(){
  const el = document.getElementById('stage-cards');
  el.innerHTML = '';
  const s = t();
  s.try.stages.forEach((st,i) => {
    const card = document.createElement('div');
    const isDone = i <= curStage;
    card.className = 'stage-card' + (i===curStage ? ' active':'') + (isDone ? ' done':'');
    const needsRun = i >= TOPTAB_STAGE_COUNT;

    const num = document.createElement('div');
    num.className = 'sc-num';
    num.textContent = isDone ? '✓' : i;
    card.appendChild(num);

    const body = document.createElement('div');
    body.className = 'sc-body';
    const title = document.createElement('div');
    title.className = 'sc-title';
    title.textContent = i + ' ' + st.name;
    const desc = document.createElement('div');
    desc.className = 'sc-desc';
    desc.textContent = st.desc;
    body.appendChild(title);
    body.appendChild(desc);
    if(needsRun){
      const runBtn = document.createElement('button');
      runBtn.className = 'btn';
      runBtn.style.marginTop = '6px';
      runBtn.style.fontSize = '11px';
      runBtn.style.padding = '5px 10px';
      runBtn.textContent = isDone ? s.try.rerun : s.try.run;
      runBtn.onclick = (e) => { e.stopPropagation(); curStage = i; renderTry(); };
      body.appendChild(runBtn);
    }
    card.appendChild(body);

    const thumb = document.createElement('div');
    thumb.className = 'sc-thumb';
    const img = document.createElement('img');
    img.src = imagePath(curMode, i);
    img.alt = '';
    img.onerror = () => {
      if(img.src.indexOf(TEMP_IMAGE) === -1){ img.src = TEMP_IMAGE; }
      else{ thumb.style.display = 'none'; }
    };
    thumb.appendChild(img);
    card.appendChild(thumb);

    card.onclick = () => { curStage = i; renderTry(); };
    el.appendChild(card);
  });
}

function renderTry(){
  const s = t();
  document.getElementById('work-mode-name').textContent = s.try.modes[curMode].name;
  renderModeGrid();
  renderStageTabstrip();
  renderStageCards();

  document.getElementById('stage-badge').textContent = s.try.result_note;
  document.getElementById('stage-label').textContent =
    s.try.modes[curMode].name + ' / ' + s.try.stages[curStage].name;

  const stageImg = document.getElementById('stage-img');
  const glyphEl = document.getElementById('stage-glyph');
  const path = imagePath(curMode, curStage);
  stageImg.src = path;
  stageImg.style.display = 'block';
  glyphEl.style.display = 'none';
  stageImg.onerror = () => {
    if(stageImg.src.indexOf(TEMP_IMAGE) === -1){
      stageImg.src = TEMP_IMAGE;
      return;
    }
    stageImg.style.display = 'none';
    glyphEl.style.display = 'flex';
    glyphEl.style.alignItems = 'center';
    glyphEl.style.justifyContent = 'center';
    glyphEl.textContent = SAMPLE_GLYPH;
  };

  const isLast = curStage === s.try.stages.length - 1;
  document.getElementById('own-photo-banner').classList.toggle('show', isLast);
}
document.getElementById('btn-prev').onclick = () => { if(curStage>0){ curStage--; renderTry(); } };
document.getElementById('btn-next').onclick = () => { if(curStage < t().try.stages.length-1){ curStage++; renderTry(); } };

/* ---------- LEARN ---------- */
function renderToc(){
  const el = document.getElementById('toc');
  el.innerHTML = '';
  t().learn.toc.forEach(item => {
    const d = document.createElement('div');
    d.className = 'toc-item' + (item.indent ? ' toc-sub':'') + (item.id===curTopic ? ' active':'');
    d.textContent = item.label;
    d.onclick = () => { curTopic = item.id; renderToc(); renderLearnContent(); };
    el.appendChild(d);
  });
}
function findLabel(id){
  const found = t().learn.toc.find(x => x.id === id);
  return found ? found.label : id;
}
function renderLearnContent(){
  const el = document.getElementById('learn-content');
  el.innerHTML = '';
  const h = document.createElement('h2');
  h.textContent = findLabel(curTopic);
  el.appendChild(h);

  if(curTopic.startsWith('stage') || curTopic === 'modes'){
    const link = document.createElement('div');
    link.className = 'try-link';
    link.textContent = t().learn.try_link;
    link.onclick = () => goTo('try');
    el.appendChild(link);
  }
  [90,75,60].forEach(w => {
    const p = document.createElement('div');
    p.className = 'placeholder-line';
    p.style.width = w + '%';
    el.appendChild(p);
  });
  const box = document.createElement('div');
  box.className = 'detail-box';
  const closedText = lang === 'ja' ? '＋ 詳細説明を表示（仮）' : '+ Show details (placeholder)';
  const openText = lang === 'ja' ? '－ 詳細説明（プレースホルダー本文）' : '− Details (placeholder body text)';
  box.textContent = closedText;
  box.onclick = () => {
    box.classList.toggle('open');
    box.textContent = box.classList.contains('open') ? openText : closedText;
  };
  el.appendChild(box);
}

/* ---------- DOWNLOAD ---------- */
function renderOsRow(){
  const el = document.getElementById('os-row');
  el.innerHTML = '';
  OS_LIST.forEach((os,i) => {
    const b = document.createElement('button');
    b.className = 'os-btn' + (i===curOs ? ' active':'');
    b.textContent = os.key;
    b.onclick = () => { curOs = i; renderOsRow(); };
    el.appendChild(b);
  });
}
document.getElementById('dl-btn').onclick = () => {
  const os = OS_LIST[curOs];
  const fileName = 'SketchAssist-Setup-' + os.key + '-v0.1.0.' + os.ext + '.txt';
  const content =
    (lang==='ja'
      ? 'これはSketchAssist UIプロトタイプのテスト用ダミーファイルです。\n実際のインストーラーではありません。\n\n'
      : 'This is a dummy test file for the SketchAssist UI prototype.\nThis is not a real installer.\n\n') +
    'OS: ' + os.key + '\nVersion: v0.1.0\n' +
    (lang==='ja' ? 'ダウンロード日時: ' : 'Downloaded: ') + new Date().toLocaleString(lang==='ja'?'ja-JP':'en-US') + '\n';
  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  document.getElementById('dl-note').textContent = t().download.note_dl(os.key, fileName);
};
function toggleGuide(){ document.getElementById('guide-box').classList.toggle('open'); }

/* ---------- full render ---------- */
function renderAll(){
  renderStaticText();
  renderTry();
  renderToc();
  renderLearnContent();
  renderOsRow();
  document.getElementById('dl-note').textContent = '';
}
renderAll();
</script>
